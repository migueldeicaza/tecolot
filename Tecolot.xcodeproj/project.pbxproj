				"$(DERIVED_FILE_DIR)/terminfo/73/swifterm-terminfo",
				"$(DERIVED_FILE_DIR)/terminfo/78",
				"$(DERIVED_FILE_DIR)/terminfo/78/xterm-256color",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -eu\n\n# Xcode lays SourcePackages out differently for `build` and `archive`, so both\n# candidates are declared as inputs of this phase and we use whichever exists.\n# Reading an undeclared path would be denied by the user script sandbox.\nsource_file=\"\"\nfor candidate in \"${SCRIPT_INPUT_FILE_0}\" \"${SCRIPT_INPUT_FILE_1}\"; do\n    if [ -f \"${candidate}\" ]; then\n        source_file=\"${candidate}\"\n        break\n    fi\ndone\n\noutput_directory=\"${DERIVED_FILE_DIR}/terminfo\"\n# macOS tic uses hexadecimal directory names.\ncompiled_entry=\"${output_directory}/73/swifterm-terminfo\"\nxterm_entry=\"${output_directory}/78/xterm-256color\"\n\nif [ -z \"${source_file}\" ]; then\n    echo \"error: SwiftTerm terminfo source not found. Looked in:\" >&2\n    echo \"error:   ${SCRIPT_INPUT_FILE_0}\" >&2\n    echo \"error:   ${SCRIPT_INPUT_FILE_1}\" >&2\n    exit 1\nfi\n\n/usr/bin/tic -x -o \"${output_directory}\" \"${source_file}\"\n/usr/bin/sed 's/^swifterm-terminfo,/xterm-256color,/' \"${source_file}\" | \\\n    /usr/bin/tic -x -o \"${output_directory}\" /dev/stdin\n\nif [ ! -f \"${compiled_entry}\" ]; then\n    echo \"error: tic did not create ${compiled_entry}\" >&2\n    exit 1\nfi\n\nif [ ! -f \"${xterm_entry}\" ]; then\n    echo \"error: tic did not create ${xterm_entry}\" >&2\n    exit 1\nfi\n";
