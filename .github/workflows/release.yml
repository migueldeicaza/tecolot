name: Release signed DMG

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DEVELOPMENT_TEAM: PJQC57N853

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate tag and secrets
        shell: bash
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v?[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Use a version tag such as v1.0.0." >&2
            exit 1
          fi

          for variable in \
            P12_BASE64 \
            P12_PASSWORD \
            NOTARY_KEY_ID \
            NOTARY_ISSUER_ID \
            NOTARY_KEY_BASE64
          do
            if [[ -z "${!variable:-}" ]]; then
              echo "The $variable secret is not set." >&2
              exit 1
            fi
          done

          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        shell: bash
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/tecolot-build.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | awk '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$signing_identity" ]]; then
            echo "The PKCS #12 file has no Developer ID Application identity." >&2
            exit 1
          fi

          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Archive signed app
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project Tecolot.xcodeproj \
            -scheme Tecolot \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -skipPackagePluginValidation \
            -archivePath "$RUNNER_TEMP/Tecolot.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

          app_path="$RUNNER_TEMP/Tecolot.xcarchive/Products/Applications/Tecolot.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --display --verbose=2 "$app_path"
          echo "APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Create and sign DMG
        shell: bash
        run: |
          set -euo pipefail

          dmg_path="$RUNNER_TEMP/Tecolot-$RELEASE_VERSION.dmg"
          scripts/create-dmg.sh "$APP_PATH" "$dmg_path" "Tecolot $RELEASE_VERSION"
          codesign \
            --force \
            --sign "$SIGNING_IDENTITY" \
            --timestamp \
            "$dmg_path"
          codesign --verify --verbose=2 "$dmg_path"
          echo "DMG_PATH=$dmg_path" >> "$GITHUB_ENV"

      - name: Notarize and staple DMG
        shell: bash
        env:
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          notary_key_path="$RUNNER_TEMP/AuthKey_$NOTARY_KEY_ID.p8"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$notary_key_path"

          xcrun notarytool submit "$DMG_PATH" \
            --key "$notary_key_path" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=2 \
            "$DMG_PATH"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tecolot-${{ env.RELEASE_VERSION }}
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DMG_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$DMG_PATH" \
              --verify-tag \
              --generate-notes \
              --title "Tecolot $RELEASE_VERSION"
          fi

      - name: Remove temporary keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
